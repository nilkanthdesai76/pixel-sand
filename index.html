<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelSand — 60 FPS Cellular Automata Physics Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sandbox-shell">
    <!-- Header -->
    <header class="sandbox-header">
      <div class="brand">
        <span class="brand-icon">🧪</span>
        <div>
          <h1>Pixel<span>Sand</span></h1>
          <span class="sub">60 FPS CELLULAR AUTOMATA PHYSICS ENGINE</span>
        </div>
      </div>

      <!-- Live Performance Stats -->
      <div class="stats-rack">
        <div class="stat-badge">
          <span class="stat-label">FPS</span>
          <span class="stat-val" id="valFps">60</span>
        </div>
        <div class="stat-badge">
          <span class="stat-label">PARTICLES</span>
          <span class="stat-val" id="valParticles">0</span>
        </div>
      </div>

      <!-- Global Actions -->
      <div class="header-actions">
        <button id="btnPause" class="action-btn" onclick="togglePause()">⏸ PAUSE</button>
        <button class="action-btn" onclick="stepSimulation()">⏭ STEP</button>
        <button class="action-btn btn-danger" onclick="clearGrid()">🗑️ CLEAR</button>
        <button class="action-btn btn-export" onclick="exportSnapshot()">📸 EXPORT PNG</button>
      </div>
    </header>

    <!-- Main Sandbox Workspace -->
    <main class="sandbox-workspace">
      <!-- Left: Elements Palette -->
      <aside class="palette-panel">
        <h3>MATERIALS</h3>
        <div class="element-grid" id="elementGrid">
          <!-- Elements generated via JS -->
        </div>

        <div class="control-section">
          <label>BRUSH RADIUS: <span id="valBrushSize">6</span>px</label>
          <input type="range" id="brushSize" min="1" max="30" value="6" oninput="updateBrushSize(this.value)">
        </div>

        <div class="control-section">
          <label>GRAVITY VECTOR</label>
          <div class="gravity-buttons">
            <button class="grav-btn active" id="gravDown" onclick="setGravity('down')">⬇️ DOWN</button>
            <button class="grav-btn" id="gravZero" onclick="setGravity('zero')">🌌 ZERO-G</button>
            <button class="grav-btn" id="gravUp" onclick="setGravity('up')">⬆️ UP</button>
          </div>
        </div>

        <div class="control-section">
          <label>THERMAL / HEAT OVERLAY</label>
          <button class="toggle-btn" id="btnThermal" onclick="toggleThermal()">🔥 HEATMAP: OFF</button>
        </div>
      </aside>

      <!-- Center: Simulation Canvas -->
      <section class="canvas-stage">
        <canvas id="simCanvas" width="240" height="180"></canvas>
      </section>
    </main>

    <!-- Footer -->
    <footer class="sandbox-footer">
      <span>Reactive Chemistry: Fire ignites Gunpowder & Oil • Water quenches Lava & Fire • Acid dissolves Solids • Oil floats on Water</span>
      <span>Engine by Nilkanth Desai</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
